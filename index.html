<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dialed-In</title>
  <meta name="description" content="Offline log for peptides, protocols, weight, blood pressure and labs, with reconstitution and dose calculators.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dialed-In">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Today</h1>
    <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">
      <span aria-hidden="true">⚙</span>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today" class="active"><span class="ti">◉</span>Today</button>
    <button data-tab="body"><span class="ti">♥</span>Body</button>
    <button data-tab="calc"><span class="ti">⚗</span>Calc</button>
    <button data-tab="history"><span class="ti">☰</span>History</button>
    <button data-tab="stack"><span class="ti">▦</span>Stack</button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
